<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minesweeper</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="header-left"><span id="timer">00:00</span></div>
    <div class="header-center"><span id="status-emoji">😊</span></div>
    <div class="header-right"><span id="mines-left">99</span></div>
    <button id="theme-toggle">🌙</button>
  </header>


  <main>
    <div id="grid" class="grid"></div>
  </main>

  <section id="leaderboard">
    <h2>Top Scores</h2>
    <ol id="scores-list"></ol>
  </section>

  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <h2>Victory!</h2>
      <p>Enter your initials:</p>
      <input type="text" id="initials" maxlength="3" />
      <button id="submit-score">Submit</button>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
